name: MerJo
options:
  bundleIdPrefix: com.apolox28
  deploymentTarget:
    iOS: "15.0"
targets:
  MerJo:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - MerJo
    info:
      path: MerJo/Info.plist
      properties:
        CFBundleDisplayName: Mejor
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "3"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Para enviar fotos y videos en tus mensajes.
        NSMicrophoneUsageDescription: Para enviar notas de voz y videos con sonido.
        NSPhotoLibraryUsageDescription: Para adjuntar fotos y videos a tus mensajes.
        NSPhotoLibraryAddUsageDescription: Para guardar fotos que te envían.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apolox28.merjo
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
