name: Compilar IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar ícono
        run: swift scripts/make-icon.swift Directo/Assets.xcassets/AppIcon.appiconset/icon-1024.png

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar (sin firmar)
        run: |
          xcodebuild -project Directo.xcodeproj -scheme Directo \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Directo.app Payload/
          zip -qry Directo.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Directo-ipa
          path: Directo.ipa
